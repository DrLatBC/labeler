<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labeler</title>
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #eceef2;
  --text: #15181d;
  --muted: #6b7280;
  --line: #d9dce2;
  --accent: #2563eb;
  --star: #fbbf24;
  --accent-text: #ffffff;
  --ok: #16a34a;
  --warn: #d97706;
  --bad: #dc2626;
  --label: #ffffff;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114;
    --surface: #171a1f;
    --surface-2: #22262d;
    --text: #e8eaee;
    --muted: #9aa1ac;
    --line: #2c3139;
    --accent: #3b82f6;
    --label: #f3f3f0;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114;
  --surface: #171a1f;
  --surface-2: #22262d;
  --text: #e8eaee;
  --muted: #9aa1ac;
  --line: #2c3139;
  --accent: #3b82f6;
  --label: #f3f3f0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
  display: flex; flex-direction: column;
}
button, input, select, textarea { font: inherit; color: inherit; }
svg { width: 20px; height: 20px; flex: none; }

.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar h1 { font-size: 17px; margin: 0; flex: 1; letter-spacing: .2px; }
.conn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface-2); cursor: pointer;
}
.conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn[data-state="on"] .dot { background: var(--ok); }
.conn[data-state="busy"] .dot { background: var(--warn); }
.conn[data-state="err"] .dot { background: var(--bad); }

main {
  flex: 1; width: 100%;
  max-width: 1100px; margin: 0 auto;
  padding: 16px;
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 900px) {
  main { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; padding: 24px; gap: 24px; }
  .preview-card { position: sticky; top: 84px; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.preview-card { display: grid; gap: 12px; }
.stage {
  display: grid; place-items: center;
  min-height: 180px; padding: 20px;
  border-radius: 8px;
  background: repeating-linear-gradient(45deg, var(--surface-2) 0 10px, transparent 10px 20px);
}
#preview {
  display: block; max-width: 100%;
  background: var(--label);
  border-radius: 6px;
  outline: 3px solid var(--muted);
  outline-offset: 2px;
  box-shadow: 0 1px 2px rgba(0,0,0,.15), 0 6px 18px rgba(0,0,0,.12);
  image-rendering: pixelated;
}
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }

.controls { display: grid; gap: 16px; }
.group { display: grid; gap: 12px; }
.group + .group { padding-top: 16px; border-top: 1px solid var(--line); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
label.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }

.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--surface-2); border-radius: 10px;
}
.seg button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 40px; height: 34px; padding: 0 12px;
  border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }

textarea, select, input[type="number"] {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid transparent; border-radius: 10px;
  padding: 10px 12px;
}
textarea { min-height: 96px; resize: vertical; font-size: 16px; }
textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input[type="number"] { width: 76px; text-align: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.range { display: grid; grid-template-columns: 24px 1fr 36px; align-items: center; gap: 10px; color: var(--muted); }
.range output { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); cursor: pointer;
}
.icon-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

.drop {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 96px; padding: 16px;
  border: 1.5px dashed var(--line); border-radius: 10px;
  color: var(--muted); cursor: pointer; text-align: center;
}
.drop.has { justify-content: space-between; border-style: solid; color: var(--text); }
.drop img { max-height: 64px; max-width: 50%; border-radius: 4px; }

.search {
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px; border-radius: 10px; background: var(--surface-2);
}
.search input { flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; font-size: 16px; }
.search input:focus { outline: none; }
.search:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 320px; overflow-y: auto; }
.results button {
  width: 100%; display: grid; gap: 2px; text-align: left;
  padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
}
.results button:hover { background: var(--surface-2); }
.results button[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.results .sub { font-size: 13px; color: var(--muted); }
.photos {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); cursor: pointer; font-weight: 600;
}
#hbPhotosRow[aria-busy="true"] { pointer-events: none; opacity: .7; }

.cam { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #000; color: #fff; }
.cam video { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .2s; }
.cam-flash.on { opacity: .6; transition: none; }
.cam-shots { position: absolute; left: 0; right: 0; bottom: 124px; display: flex; gap: 10px; padding: 8px 16px; overflow-x: auto; }
.cam-shots div { position: relative; flex: none; }
.cam-shots img { display: block; width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; }
.cam-shots button {
  position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; padding: 0;
  display: grid; place-items: center; border: 0; border-radius: 50%; background: #000; color: #fff;
}
.cam-shots button svg { width: 14px; height: 14px; }
.cam-shots button.star { top: auto; bottom: -7px; }
.cam-shots button[aria-pressed="true"] { color: var(--star); --star-fill: currentColor; }
.cam-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 28px; padding-bottom: max(24px, env(safe-area-inset-bottom));
}
.cam-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 52px; height: 52px; padding: 0 14px; border: 0; border-radius: 26px;
  background: rgba(255,255,255,.16); color: #fff; font-weight: 600; font-size: 16px;
}
.cam-done { background: var(--accent); }
.cam-done:disabled { background: rgba(255,255,255,.16); opacity: .5; }
.cam-shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: #fff; box-shadow: inset 0 0 0 4px #000; }
.cam-shutter:active { transform: scale(.93); }
.viewer { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: #000; color: #fff; }
.viewer-track { flex: 1; min-height: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.viewer-track::-webkit-scrollbar { display: none; }
.viewer-track img { flex: none; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
.viewer .cam-bar { position: relative; }
.viewer .cam-bar span { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-variant-numeric: tabular-nums; }
.viewer-actions { display: flex; gap: 12px; }
.viewer .cam-btn[aria-pressed="true"] { color: var(--star); }
.viewer .cam-btn[aria-pressed="true"] { --star-fill: currentColor; }

.gallery { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }
.gallery div { position: relative; flex: none; }
.gallery img {
  display: block; width: 72px; height: 72px; object-fit: cover; cursor: pointer;
  border-radius: 8px; background: var(--surface-2);
}
.gallery button {
  position: absolute; right: 4px; bottom: 4px; width: 28px; height: 28px; padding: 0;
  display: grid; place-items: center; border: 0; border-radius: 50%;
  background: rgba(0,0,0,.55); color: #fff; cursor: pointer;
}
.gallery button.del { top: 4px; bottom: auto; }
.gallery button svg { width: 16px; height: 16px; }
.gallery button[aria-pressed="true"] { color: var(--star); }
.gallery button[aria-pressed="true"] { --star-fill: currentColor; }
.note { color: var(--muted); font-size: 14px; padding: 4px 2px; }
.note a { color: var(--accent); }

.size-custom { display: none; }
.size-custom.show { display: flex; }
.x { color: var(--muted); }

.printbar {
  position: sticky; bottom: 0; z-index: 5;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.printbar .inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 40px; height: 48px; border: 0; background: var(--surface-2); cursor: pointer; font-size: 18px; }
.stepper span { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.print {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 48px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-text);
  font-weight: 600; font-size: 16px; cursor: pointer;
}
.print:disabled { opacity: .55; cursor: default; }
.progress { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 10px; display: none; }
.progress.show { display: block; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }

.toast {
  position: fixed; z-index: 40; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
  max-width: calc(100% - 32px);
  padding: 10px 14px; border-radius: 10px;
  background: var(--text); color: var(--bg); font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }
</style>
</head>
<body>

<header class="bar">
  <h1>Labeler</h1>
  <button class="conn" id="conn" data-state="off" title="Connect printer">
    <svg><use href="#i-bt"/></svg><span class="dot"></span><span id="connName">M110</span>
  </button>
</header>

<main>
  <section class="card preview-card" aria-label="Preview">
    <div class="stage"><canvas id="preview"></canvas></div>
    <div class="meta"><span id="dims"></span><span id="sizeName"></span></div>
  </section>

  <section class="card controls">
    <div class="group">
      <div class="seg full" role="group" aria-label="Content">
        <button data-mode="text" aria-pressed="true" title="Text"><svg><use href="#i-text"/></svg></button>
        <button data-mode="image" aria-pressed="false" title="Image"><svg><use href="#i-image"/></svg></button>
        <button data-mode="homebox" aria-pressed="false" title="Homebox" class="hidden" id="hbTab"><svg><use href="#i-box"/></svg></button>
      </div>

      <div id="hbPane" class="group hidden">
        <div class="row">
          <div class="seg" role="group" aria-label="Kind">
            <button data-kind="item" title="Items"><svg><use href="#i-box"/></svg></button>
            <button data-kind="location" title="Locations"><svg><use href="#i-pin"/></svg></button>
          </div>
          <label class="search grow">
            <svg><use href="#i-search"/></svg>
            <input type="search" id="hbQuery" placeholder="Search Homebox" autocomplete="off">
          </label>
        </div>
        <div class="row hidden" id="hbPhotosRow">
          <button class="photos grow" id="hbCamBtn"><svg><use href="#i-camera"/></svg><span id="hbPhotosLabel">Add photos</span></button>
          <label class="icon-btn" title="From gallery">
            <input type="file" id="hbPhotos" accept="image/*" multiple hidden>
            <svg><use href="#i-image"/></svg>
          </label>
        </div>
        <div class="gallery hidden" id="hbGallery"></div>
        <div class="note hidden" id="hbNote"></div>
        <ul class="results" id="hbResults"></ul>
      </div>

      <div id="textPane" class="group">
        <textarea id="text" placeholder="Label text" spellcheck="false"></textarea>
        <div class="row">
          <div class="seg" role="group" aria-label="Align">
            <button data-align="left" title="Left"><svg><use href="#i-left"/></svg></button>
            <button data-align="center" title="Center"><svg><use href="#i-center"/></svg></button>
            <button data-align="right" title="Right"><svg><use href="#i-right"/></svg></button>
          </div>
          <button class="icon-btn" id="bold" title="Bold"><svg><use href="#i-bold"/></svg></button>
          <button class="icon-btn" id="border" title="Border"><svg><use href="#i-border"/></svg></button>
          <button class="icon-btn" id="invertText" title="White on black"><svg><use href="#i-invert"/></svg></button>
          <select id="font" class="grow" aria-label="Font">
            <option value="system-ui, sans-serif">Sans</option>
            <option value="Georgia, serif">Serif</option>
            <option value="ui-monospace, Consolas, monospace">Mono</option>
            <option value="Impact, 'Arial Black', sans-serif">Heavy</option>
          </select>
        </div>
        <div class="row">
          <button class="icon-btn" id="fit" title="Auto size"><svg><use href="#i-fit"/></svg></button>
          <div class="range grow" id="sizeRow">
            <svg><use href="#i-text"/></svg>
            <input type="range" id="fontSize" min="12" max="200" step="1" aria-label="Text size">
            <output id="fontSizeOut"></output>
          </div>
        </div>
      </div>

      <div id="imagePane" class="group hidden">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*" hidden>
          <span id="dropHint"><svg style="vertical-align:-5px"><use href="#i-image"/></svg>&nbsp; Choose image</span>
          <img id="thumb" alt="" class="hidden">
          <button class="icon-btn hidden" id="clearImg" title="Remove"><svg><use href="#i-x"/></svg></button>
        </label>
        <div class="row">
          <button class="icon-btn" id="dither" title="Dither"><svg><use href="#i-dots"/></svg></button>
          <button class="icon-btn" id="invertImg" title="Invert"><svg><use href="#i-invert"/></svg></button>
          <div class="range grow">
            <svg><use href="#i-sun"/></svg>
            <input type="range" id="bright" min="-100" max="100" step="1" aria-label="Brightness">
            <output id="brightOut"></output>
          </div>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <label class="field grow">Label

  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
// M110 protocol, matching pyphomemo / phomymo / phomemo-tools.
const M110 = {
  DOTS_PER_MM: 8,
  HEAD_DOTS: 384,
  SERVICES: [0xff00, 0xffe0, 0xae30, '49535343-fe7d-4ae5-8fa9-9fafd205e455'],
  WRITE_CHAR: 0xff02,
  NOTIFY_CHAR: 0xff03,
  CHUNK: 128,
  speed: s => [0x1b, 0x4e, 0x0d, s],
  density: d => [0x1b, 0x4e, 0x04, d],
  media: m => [0x1f, 0x11, m],
  raster: (wb, h) => [0x1d, 0x76, 0x30, 0x00, wb & 0xff, wb >> 8, h & 0xff, h >> 8],
  FOOTER: [0x1f, 0xf0, 0x05, 0x00, 0x1f, 0xf0, 0x03, 0x00],
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const DEFAULTS = {
  mode: 'text', text: '', align: 'center', bold: true, border: false, invertText: false,
  font: 'system-ui, sans-serif', fit: true, fontSize: 48,
  dither: true, invertImg: false, bright: 0, hbKind: 'item',
  size: '40x30', cw: 40, ch: 30, media: 10, density: 10, copies: 1,
};
let S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem('labeler') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('labeler', JSON.stringify(S)); } catch {} };

let image = null;
let bitmap = null;

function labelDots() {
  const [w, h] = S.size === 'custom' ? [S.cw, S.ch] : S.size.split('x').map(Number);
  const wmm = Math.min(Math.max(w || 40, 10), M110.HEAD_DOTS / M110.DOTS_PER_MM);
  const hmm = Math.min(Math.max(h || 30, 10), 200);
  return { wmm, hmm, w: wmm * M110.DOTS_PER_MM, h: hmm * M110.DOTS_PER_MM };
}

function layoutLines(ctx, text, size, maxW, style) {
  ctx.font = `${style.weight} ${size}px ${style.family}`;
  const out = [];
  for (const para of text.split('\n')) {
    const words = para.split(/(\s+)/);
    let line = '';
    for (const w of words) {
      const next = line + w;
      if (line && ctx.measureText(next).width > maxW && w.trim()) { out.push(line.trimEnd()); line = w.trimStart(); }
      else line = next;
    }
    out.push(line);
  }
  return out;
}

function fits(ctx, text, size, maxW, maxH, style) {
  const lines = layoutLines(ctx, text, size, maxW, style);
  const tooWide = lines.some(l => ctx.measureText(l).width > maxW);
  return !tooWide && lines.length * size * 1.15 <= maxH;
}

// Largest size (up to hi) where text wraps within maxW x maxH without splitting a word.
function fitSize(ctx, text, maxW, maxH, style, hi = 400) {
  let lo = 8;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; fits(ctx, text, mid, maxW, maxH, style) ? lo = mid : hi = mid; }
  return lo;
}

function drawText(ctx, w, h) {
  const pad = Math.round(Math.min(w, h) * 0.06) + (S.border ? 6 : 0);
  const maxW = w - pad * 2, maxH = h - pad * 2;
  const text = S.text || '';
  const style = { weight: S.bold ? 700 : 400, family: S.font };
  const size = S.fit && text.trim() ? fitSize(ctx, text, maxW, maxH, style) : S.fontSize;
  const fg = S.invertText ? '#fff' : '#000';
  if (S.invertText) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); }
  if (S.border) { ctx.strokeStyle = fg; ctx.lineWidth = 4; ctx.strokeRect(6, 6, w - 12, h - 12); }
  if (!text.trim()) return size;
  const lines = layoutLines(ctx, text, size, maxW, style);
  const lh = size * 1.15;
  ctx.fillStyle = fg;
  ctx.textBaseline = 'middle';
  ctx.textAlign = S.align;
  const x = S.align === 'left' ? pad : S.align === 'right' ? w - pad : w / 2;
  let y = h / 2 - (lines.length - 1) * lh / 2;
  for (const l of lines) { ctx.fillText(l, x, y); y += lh; }
  return size;
}

// QR (same link Homebox's own labels use) on the left, name auto-sized on the right, details below it.
function drawHomebox(ctx, w, h) {
  const lb = hb.label;
  if (!lb) return;
  const m = Math.round(Math.min(w, h) * 0.05);
  ctx.fillStyle = '#000';

  // Tall labels stack the QR above the text instead of beside it.
  const tall = h > w * 1.2;
  let qrSize = 0;
  if (window.qrcode) {
    const qr = qrcode(0, 'M');
    qr.addData(lb.url);
    qr.make();
    const n = qr.getModuleCount();
    const box = tall ? Math.min(w - 2 * m, h * 0.5) : Math.min(h - 2 * m, w * 0.5);
    const cell = Math.floor(box / n);
    qrSize = cell * n;
    const x0 = tall ? Math.round((w - qrSize) / 2) : m;
    const y0 = tall ? m : Math.round((h - qrSize) / 2);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) ctx.fillRect(x0 + c * cell, y0 + r * cell, cell, cell);
    }
  }

  const tx = qrSize && !tall ? 2 * m + qrSize : m;
  const ty = qrSize && tall ? 2 * m + qrSize : m;
  const tw = w - tx - m, th = h - ty - m;
  const family = 'system-ui, sans-serif';
  const nameStyle = { weight: 700, family };
  const subStyle = { weight: 400, family };

  // Details share one size and may wrap one extra line before shrinking.
  const details = lb.sub.filter(Boolean);
  const subMax = Math.max(14, Math.round(Math.min(w, h) * 0.09));
  const subText = details.join('\n');
  const subSize = details.length ? fitSize(ctx, subText, tw, subMax * 1.15 * (details.length + 1), subStyle, subMax + 1) : 0;
  const subLines = details.length ? layoutLines(ctx, subText, subSize, tw, subStyle) : [];
  const subH = subLines.length * subSize * 1.15;
  const gap = details.length ? Math.round(m * 0.8) : 0;

  const nameSize = fitSize(ctx, lb.name, tw, th - subH - gap, nameStyle, Math.round(Math.min(w, h) * 0.3));
  const lines = layoutLines(ctx, lb.name, nameSize, tw, nameStyle);
  const nameH = lines.length * nameSize * 1.15;

  const x = tall ? w / 2 : tx;
  let y = ty + Math.round((th - nameH - gap - subH) / 2);
  ctx.textAlign = tall ? 'center' : 'left';
  ctx.textBaseline = 'top';
  for (const l of lines) { ctx.fillText(l, x, y); y += nameSize * 1.15; }
  y += gap;
  ctx.font = `${subStyle.weight} ${subSize}px ${family}`;
  for (const l of subLines) { ctx.fillText(l, x, y); y += subSize * 1.15; }
}

function drawImage(ctx, w, h, img) {
  if (!img) return;
  const r = Math.min(w / img.width, h / img.height);
  const dw = img.width * r, dh = img.height * r;
  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

// Returns 1-bit rows packed MSB-first, 1 = black, as the M110 expects.
function toBitmap(ctx, w, h, dither) {
  const px = ctx.getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h);
  const b = S.mode === 'image' ? S.bright * 1.28 : 0;
  const inv = S.mode === 'image' && S.invertImg;
  for (let i = 0; i < w * h; i++) {
    const a = px[i * 4 + 3] / 255;
    let v = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) * a + 255 * (1 - a) + b;
    if (inv) v = 255 - v;
    g[i] = v;
  }
  const wb = Math.ceil(w / 8);
  const out = new Uint8Array(wb * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = g[i];
      const black = old < 128;
      if (black) out[y * wb + (x >> 3)] |= 0x80 >> (x & 7);
      if (dither) {
        const err = old - (black ? 0 : 255);
        if (x + 1 < w) g[i + 1] += err * 7 / 16;
        if (y + 1 < h) {
          if (x > 0) g[i + w - 1] += err * 3 / 16;
          g[i + w] += err * 5 / 16;
          if (x + 1 < w) g[i + w + 1] += err * 1 / 16;
        }
      }
    }
  }
  return { w, h, wb, data: out };
}

function render() {
  const { wmm, hmm, w, h } = labelDots();
  const work = document.createElement('canvas');
  work.width = w; work.height = h;
  const ctx = work.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  let used = null;
  if (S.mode === 'text') used = drawText(ctx, w, h);
  else if (S.mode === 'image') drawImage(ctx, w, h, image);
  else drawHomebox(ctx, w, h);
  bitmap = toBitmap(ctx, w, h, S.mode === 'image' && S.dither);

  const pv = $('preview');
  pv.width = w; pv.height = h;
  const pctx = pv.getContext('2d');
  const img = pctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const on = bitmap.data[y * bitmap.wb + (x >> 3)] & (0x80 >> (x & 7));
    const o = (y * w + x) * 4;
    const v = on ? 20 : 255;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = v; img.data[o + 3] = on ? 255 : 0;
  }
  pctx.putImageData(img, 0, 0);
  const scale = Math.min(3, 520 / w);
  pv.style.width = (w * scale) + 'px';

  $('dims').textContent = `${w} × ${h} dots`;
  $('sizeName').textContent = `${wmm} × ${hmm} mm`;
  if (S.fit && used) { $('fontSize').value = used; $('fontSizeOut').textContent = used; }
}

function syncUI() {
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
  $('textPane').classList.toggle('hidden', S.mode !== 'text');
  $('imagePane').classList.toggle('hidden', S.mode !== 'image');
  $('hbPane').classList.toggle('hidden', S.mode !== 'homebox');
  document.querySelectorAll('[data-kind]').forEach(b => b.setAttribute('aria-pressed', b.dataset.kind === S.hbKind));
  document.querySelectorAll('[data-align]').forEach(b => b.setAttribute('aria-pressed', b.dataset.align === S.align));
  for (const k of ['bold', 'border', 'invertText', 'fit', 'dither', 'invertImg']) $(k).setAttribute('aria-pressed', !!S[k]);
  $('text').value = S.text;
  $('font').value = S.font;
  $('fontSize').value = S.fontSize; $('fontSizeOut').textContent = S.fontSize;
  $('fontSize').disabled = S.fit; $('sizeRow').style.opacity = S.fit ? .5 : 1;
  $('bright').value = S.bright; $('brightOut').textContent = S.bright;
  $('size').value = S.size;
  $('customRow').classList.toggle('show', S.size === 'custom');
  $('cw').value = S.cw; $('ch').value = S.ch;
  $('media').value = S.media;
  $('density').value = S.density; $('densityOut').textContent = S.density;
  $('copies').textContent = S.copies;
  $('printLabel').textContent = S.copies > 1 ? `Print ${S.copies}` : 'Print';
}

function set(patch) { Object.assign(S, patch); save(); syncUI(); render(); }

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  set({ mode: b.dataset.mode });
  if (S.mode === 'homebox') hbSearch();
});
document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { set({ hbKind: b.dataset.kind }); hbSearch(); });
document.querySelectorAll('[data-align]').forEach(b => b.onclick = () => set({ align: b.dataset.align }));
for (const k of ['bold', 'border', 'invertText', 'fit', 'dither', 'invertImg']) $(k).onclick = () => set({ [k]: !S[k] });
$('text').oninput = e => set({ text: e.target.value });
$('font').onchange = e => set({ font: e.target.value });
$('fontSize').oninput = e => set({ fontSize: +e.target.value });
$('bright').oninput = e => set({ bright: +e.target.value });
$('size').onchange = e => set({ size: e.target.value });
$('cw').onchange = e => set({ cw: +e.target.value });
$('ch').onchange = e => set({ ch: +e.target.value });
$('media').onchange = e => set({ media: +e.target.value });
$('density').oninput = e => set({ density: +e.target.value });
$('minus').onclick = () => set({ copies: Math.max(1, S.copies - 1) });
$('plus').onclick = () => set({ copies: Math.min(50, S.copies + 1) });

function loadImageFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => {
    image = im;
    $('thumb').src = url; $('thumb').classList.remove('hidden');
    $('clearImg').classList.remove('hidden'); $('dropHint').classList.add('hidden');
    $('drop').classList.add('has');
    set({ mode: 'image' });
  };
  im.src = url;
}
$('file').onchange = e => loadImageFile(e.target.files[0]);
$('clearImg').onclick = e => {
  e.preventDefault();
  image = null; $('file').value = '';
  $('thumb').classList.add('hidden'); $('clearImg').classList.add('hidden');
  $('dropHint').classList.remove('hidden'); $('drop').classList.remove('has');
  render();
};
$('drop').ondragover = e => e.preventDefault();
$('drop').ondrop = e => { e.preventDefault(); loadImageFile(e.dataTransfer.files[0]); };

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---- Bluetooth ----
const printer = { device: null, write: null, noResp: false };

function connState(state, name) {
  $('conn').dataset.state = state;
  if (name) $('connName').textContent = name;
}

async function attach() {
  connState('busy');
  const server = await printer.device.gatt.connect();
  let service = null;
  for (const uuid of M110.SERVICES) {
    try { service = await server.getPrimaryService(uuid); break; } catch {}
  }
  if (!service) throw new Error('Printer service not found');
  printer.write = await service.getCharacteristic(M110.WRITE_CHAR);
  printer.noResp = printer.write.properties.writeWithoutResponse;
  try {
    const n = await service.getCharacteristic(M110.NOTIFY_CHAR);
    await n.startNotifications();
    n.addEventListener('characteristicvaluechanged', e => console.debug('M110 notify', new Uint8Array(e.target.value.buffer)));
  } catch {}
  connState('on', printer.device.name || 'M110');
}

async function connect() {
  if (!navigator.bluetooth) { toast('Bluetooth needs Chrome on Android or desktop, over https'); return false; }
  try {
    printer.device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'M' }, { namePrefix: 'Phomemo' }, { services: [0xff00] }],
      optionalServices: M110.SERVICES,
    });
    printer.device.addEventListener('gattserverdisconnected', () => { printer.write = null; connState('off'); });
    await attach();
    return true;
  } catch (e) {
    connState(printer.write ? 'on' : 'off');
    if (e.name !== 'NotFoundError') { connState('err'); toast(e.message); }
    return false;
  }
}

async function ensureConnected() {
  if (printer.write && printer.device?.gatt.connected) return true;
  if (printer.device) { try { await attach(); return true; } catch {} }
  return connect();
}

async function send(bytes) {
  const buf = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  if (printer.noResp) await printer.write.writeValueWithoutResponse(buf);
  else await printer.write.writeValue(buf);
}

// The M110 discards the job if header, data and footer arrive as one unpaced stream.
async function printJob(bm, onProgress) {
  await send(M110.speed(5)); await sleep(30);
  await send(M110.density(S.density)); await sleep(30);
  await send(M110.media(S.media)); await sleep(30);
  await send(M110.raster(bm.wb, bm.h));
  for (let i = 0; i < bm.data.length; i += M110.CHUNK) {
    await send(bm.data.subarray(i, i + M110.CHUNK));
    await sleep(20);
    onProgress(Math.min(1, (i + M110.CHUNK) / bm.data.length));
  }
  await sleep(300);
  await send(M110.FOOTER);
  await sleep(500);
}

$('conn').onclick = () => connect();

$('print').onclick = async () => {
  if (!bitmap) return;
  if (S.mode === 'homebox' && !hb.label) { toast('Pick something from Homebox first'); return; }
  const btn = $('print');
  btn.disabled = true;
  try {
    if (!(await ensureConnected())) return;
    $('progress').classList.add('show');
    const copies = S.copies;
    for (let c = 0; c < copies; c++) {
      $('printLabel').textContent = copies > 1 ? `${c + 1} / ${copies}` : 'Printing';
      await printJob(bitmap, p => $('bar').style.width = ((c + p) / copies * 100) + '%');
    }
  } catch (e) {
    connState('err'); toast(e.message || 'Print failed');
  } finally {
    btn.disabled = false;
    $('progress').classList.remove('show'); $('bar').style.width = '0';
    syncUI();
  }
};

// ---- Full-screen photo viewer: swipe between photos, with action buttons for the one on screen ----
const viewer = { count: 0, actions: [] };
const viewerIsOpen = () => !$('viewer').classList.contains('hidden');
const viewerIndex = () => { const t = $('viewerTrack'); return Math.round(t.scrollLeft / t.clientWidth) || 0; };

function viewerRender(srcs, at) {
  const t = $('viewerTrack');
  viewer.count = srcs.length;
  t.replaceChildren(...srcs.map(src => Object.assign(document.createElement('img'), { src, alt: '' })));
  t.scrollLeft = Math.min(at, srcs.length - 1) * t.clientWidth;
  viewerPos();
}

function viewerPos() {
  const i = viewerIndex();
  $('viewerPos').textContent = `${i + 1} / ${viewer.count}`;
  viewer.actions.forEach((a, n) => {
    if (a.pressed) $('viewerActions').children[n].setAttribute('aria-pressed', a.pressed(i));
  });
}

// actions: [{ icon, label, run(index), pressed?(index) }]
function viewerOpen(srcs, at, actions) {
  viewer.actions = actions;
  $('viewerActions').replaceChildren(...actions.map(a => {
    const b = document.createElement('button');
    b.className = 'cam-btn';
    b.setAttribute('aria-label', a.label);
    b.innerHTML = `<svg><use href="#${a.icon}"/></svg>`;
    b.onclick = () => a.run(viewerIndex());
    return b;
  }));
  $('viewer').classList.remove('hidden');
  viewerRender(srcs, at);
  // Its own history entry so Android's back gesture closes the viewer only.
  history.pushState({ viewer: true }, '');
}

$('viewerTrack').onscroll = viewerPos;
$('viewerClose').onclick = () => history.back();

// ---- Homebox: only offered when this page is served from the Homebox domain ----
const hb = { available: false, label: null, photos: [] };
let hbTimer, hbSeq = 0;

async function hbApi(path, init) {
  const r = await fetch('/api/v1' + path, { credentials: 'same-origin', ...init });
  if (r.status === 401) throw Object.assign(new Error('Signed out'), { signin: true });
  if (r.status === 413) throw new Error('too large');
  if (!r.ok) throw new Error(`Homebox error ${r.status}`);
  return r;
}

function hbNote(msg, signin) {
  const n = $('hbNote');
  n.replaceChildren();
  n.classList.toggle('hidden', !msg);
  if (!msg) return;
  n.append(msg);
  if (signin) {
    const a = Object.assign(document.createElement('a'), { href: '/', target: '_blank', textContent: 'Sign in' });
    n.append(' ', a);
  }
}

function hbError(e) { hbNote(e.signin ? 'Signed out of Homebox.' : e.message, e.signin); }

function hbRenderResults(items) {
  const list = $('hbResults');
  list.replaceChildren(...items.map(it => {
    const btn = document.createElement('button');
    btn.dataset.id = it.id;
    btn.setAttribute('aria-pressed', hb.label?.id === it.id);
    const name = document.createElement('span');
    name.textContent = it.name;
    const sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = hbDetails(it).join('  ·  ');
    btn.append(name, sub);
    btn.onclick = () => hbShow(hbLabel(it, S.hbKind));
    const li = document.createElement('li');
    li.append(btn);
    return li;
  }));
}

async function hbSearch() {
  if (!hb.available) return;
  const seq = ++hbSeq;
  const q = $('hbQuery').value.trim();
  const params = new URLSearchParams({ pageSize: '25', orderBy: q ? 'name' : 'updatedAt' });
  if (q) params.set('q', q);
  if (S.hbKind === 'location') params.set('isLocation', 'true');
  try {
    const data = await (await hbApi('/entities?' + params)).json();
    if (seq !== hbSeq) return;
    hbNote(data.items.length ? '' : 'No matches');
    hbRenderResults(data.items);
  } catch (e) {
    if (seq !== hbSeq) return;
    hbRenderResults([]);
    hbError(e);
  }
}

function hbDetails(e) {
  const asset = e.assetId ? '#' + String(e.assetId).replace(/"/g, '') : '';
  return [(e.location || e.parent)?.name, asset].filter(Boolean);
}

// kind is the Homebox page the QR opens: item or location.
function hbLabel(e, kind) {
  return { id: e.id, name: e.name, sub: hbDetails(e), url: `${location.origin}/${kind}/${e.id}` };
}

function hbShow(label) {
  hb.label = label;
  $('hbPhotosRow').classList.remove('hidden');
  document.querySelectorAll('#hbResults button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === label.id));
  hbLoadPhotos();
  if (S.mode !== 'homebox') set({ mode: 'homebox' }); else render();
}

const hbAttachURL = (entityId, attId) =>
  `/api/v1/entities/${encodeURIComponent(entityId)}/attachments/${encodeURIComponent(attId)}`;
const hbPhotoURLs = () => hb.photos.map(p => hbAttachURL(hb.label.id, p.id));

async function hbLoadPhotos() {
  const target = hb.label;
  hb.photos = [];
  hbRenderGallery();
  try {
    const e = await (await hbApi('/entities/' + encodeURIComponent(target.id))).json();
    if (hb.label !== target) return;
    hb.photos = (e.attachments || []).filter(a => a.type === 'photo')
      .map(a => ({ id: a.id, title: a.title, primary: a.primary, thumb: a.thumbnail?.id || a.id }));
    hbRenderGallery();
  } catch (err) {
    if (hb.label === target) hbError(err);
  }
}

function hbRenderGallery() {
  const g = $('hbGallery');
  g.classList.toggle('hidden', !hb.photos.length);
  g.replaceChildren(...hb.photos.map((p, i) => {
    const wrap = document.createElement('div');
    const img = Object.assign(document.createElement('img'), { src: hbAttachURL(hb.label.id, p.thumb), alt: p.title, loading: 'lazy' });
    img.onclick = () => viewerOpen(hbPhotoURLs(), i, [hbStarAction, hbDeleteAction]);
    const del = document.createElement('button');
    del.className = 'del';
    del.setAttribute('aria-label', 'Delete photo');
    del.innerHTML = '<svg><use href="#i-x"/></svg>';
    del.onclick = () => hbDeletePhoto(i);
    const star = document.createElement('button');
    star.setAttribute('aria-label', 'Make main photo');
    star.setAttribute('aria-pressed', p.primary);
    star.innerHTML = '<svg><use href="#i-star"/></svg>';
    star.onclick = () => hbSetPrimary(i);
    wrap.append(img, del, star);
    return wrap;
  }));
}

// Homebox clears the old primary itself when one photo is set primary.
async function hbSetPrimary(i) {
  const target = hb.label, p = hb.photos[i];
  if (!p || p.primary) return;
  hbNote('');
  try {
    await hbApi(`/entities/${encodeURIComponent(target.id)}/attachments/${encodeURIComponent(p.id)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'photo', title: p.title, primary: true }),
    });
  } catch (e) {
    toast(e.signin ? 'Signed out of Homebox' : 'Could not set main photo');
    hbError(e);
    return;
  }
  if (hb.label !== target) return;
  hb.photos.forEach(q => { q.primary = q === p; });
  hbRenderGallery();
  if (viewerIsOpen()) viewerPos();
  toast('Main photo set');
}

const hbStarAction = { icon: 'i-star', label: 'Make main photo', run: hbSetPrimary, pressed: i => !!hb.photos[i]?.primary };

// Homebox leaves an item with no main photo when the main one is deleted, so the next one takes over here.
async function hbDeletePhoto(i) {
  const target = hb.label, p = hb.photos[i];
  if (!p || p.deleting || !confirm('Delete this photo from Homebox?')) return;
  p.deleting = true;
  hbNote('');
  try {
    await hbApi(`/entities/${encodeURIComponent(target.id)}/attachments/${encodeURIComponent(p.id)}`, { method: 'DELETE' });
  } catch (e) {
    p.deleting = false;
    toast(e.signin ? 'Signed out of Homebox' : 'Could not delete photo');
    hbError(e);
    return;
  }
  if (hb.label !== target) return;
  hb.photos = hb.photos.filter(q => q.id !== p.id);
  hbRenderGallery();
  if (viewerIsOpen()) {
    if (hb.photos.length) viewerRender(hbPhotoURLs(), i);
    else history.back();
  }
  toast('Photo deleted');
  if (p.primary && hb.photos.length) hbSetPrimary(0);
}

const hbDeleteAction = { icon: 'i-trash', label: 'Delete photo', run: hbDeletePhoto };

async function hbOpenShared({ kind, id }) {
  try {
    if (kind === 'asset') {
      // The entities list returns items only unless isLocation=true, so check both.
      for (const k of ['item', 'location']) {
        const params = new URLSearchParams({ q: '#' + id, pageSize: '1' });
        if (k === 'location') params.set('isLocation', 'true');
        const found = await (await hbApi('/entities?' + params)).json();
        if (found.items.length) return hbShow(hbLabel(found.items[0], k));
      }
      throw new Error(`Nothing in Homebox has asset #${id}`);
    } else {
      hbShow(hbLabel(await (await hbApi('/entities/' + encodeURIComponent(id))).json(), kind));
    }
  } catch (e) {
    hbError(e);
  }
}

// Android share sheet lands here with the Homebox page link in url or text.
function hbSharedTarget() {
  const p = new URLSearchParams(location.search);
  const shared = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean).join(' ');
  const m = shared.match(/\/(item|location|a)\/([\w-]+)/);
  if (!m) return null;
  return { kind: m[1] === 'a' ? 'asset' : m[1], id: m[2] };
}

async function hbInit() {
  try {
    const r = await fetch('/api/v1/status');
    hb.available = r.ok && (await r.json()).title === 'Homebox';
  } catch {}
  $('hbTab').classList.toggle('hidden', !hb.available);
  if (!hb.available) {
    if (S.mode === 'homebox') set({ mode: 'text' });
    return;
  }
  const shared = hbSharedTarget();
  if (shared) {
    history.replaceState(null, '', location.pathname);
    hbOpenShared(shared);
  }
  if (S.mode === 'homebox' || shared) hbSearch();
}

$('hbQuery').oninput = () => { clearTimeout(hbTimer); hbTimer = setTimeout(hbSearch, 250); };

// Homebox and nginx both cap a request at 10 MB (HBOX_WEB_MAX_UPLOAD_SIZE, client_max_body_size).
const UPLOAD_LIMIT = 9.5e6;

async function shrinkToLimit(file) {
  if (file.size <= UPLOAD_LIMIT) return file;
  const img = await createImageBitmap(file);
  for (const [side, quality] of [[4000, 0.88], [3000, 0.82], [2000, 0.8]]) {
    const r = Math.min(1, side / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', quality));
    if (blob.size <= UPLOAD_LIMIT) return new File([blob], file.name.replace(/\.[^.]*$/, '') + '.jpg', { type: 'image/jpeg' });
  }
  throw new Error('too large');
}

// One file per request: the Homebox attachment endpoint takes a single file.
async function hbUploadPhotos(files, mainFile) {
  const target = hb.label;
  if (!target || !files.length) return;
  const btn = $('hbPhotosRow');
  btn.setAttribute('aria-busy', 'true');
  hbNote('');
  let added = 0;
  const failed = [];
  for (const [i, f] of files.entries()) {
    $('hbPhotosLabel').textContent = `Uploading ${i + 1} / ${files.length}`;
    try {
      const file = await shrinkToLimit(f);
      const form = new FormData();
      form.append('file', file, file.name);
      form.append('name', file.name);
      form.append('type', 'photo');
      if (f === mainFile) form.append('primary', 'true');
      await hbApi(`/entities/${encodeURIComponent(target.id)}/attachments`, { method: 'POST', body: form });
      added++;
    } catch (e) {
      if (e.signin) { hbError(e); break; }
      failed.push(`${f.name} (${e.message})`);
    }
  }
  btn.removeAttribute('aria-busy');
  $('hbPhotosLabel').textContent = 'Add photos';
  if (added) toast(`${added} photo${added > 1 ? 's' : ''} added to ${target.name}`);
  if (added && hb.label === target) hbLoadPhotos();
  if (failed.length) hbNote(`Not uploaded: ${failed.join(', ')}`);
}

$('hbPhotos').onchange = e => { hbUploadPhotos([...e.target.files]); e.target.value = ''; };

// ---- Live camera: shoot several photos in a row, then upload them together ----
const cam = { stream: null, capture: null, shots: [] };
const camIsOpen = () => !$('cam').classList.contains('hidden');

async function camOpen() {
  if (!hb.label) return;
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 3072 } },
      audio: false,
    });
  } catch (e) {
    toast(e.name === 'NotAllowedError' ? 'Camera permission denied' : 'Camera unavailable');
    return;
  }
  const track = cam.stream.getVideoTracks()[0];
  cam.capture = 'ImageCapture' in window ? new ImageCapture(track) : null;
  $('camVideo').srcObject = cam.stream;
  cam.shots = [];
  camRenderShots();
  $('cam').classList.remove('hidden');
  // The camera gets its own history entry so Android's back gesture closes it instead of leaving the app.
  history.pushState({ cam: true }, '');
}

function camStop() {
  cam.stream?.getTracks().forEach(t => t.stop());
  cam.stream = null;
  $('camVideo').srcObject = null;
  cam.shots.forEach(s => URL.revokeObjectURL(s.url));
  cam.shots = [];
  $('cam').classList.add('hidden');
}

function camRenderShots() {
  $('camShots').replaceChildren(...cam.shots.map((s, i) => {
    const wrap = document.createElement('div');
    const img = Object.assign(document.createElement('img'), { src: s.url, alt: '' });
    img.onclick = () => viewerOpen(cam.shots.map(s => s.url), i, [camStarAction, camDeleteAction]);
    const del = document.createElement('button');
    del.setAttribute('aria-label', 'Remove');
    del.innerHTML = '<svg><use href="#i-x"/></svg>';
    del.onclick = () => { URL.revokeObjectURL(s.url); cam.shots.splice(i, 1); camRenderShots(); };
    const star = document.createElement('button');
    star.className = 'star';
    star.setAttribute('aria-label', 'Make main photo');
    star.setAttribute('aria-pressed', !!s.primary);
    star.innerHTML = '<svg><use href="#i-star"/></svg>';
    star.onclick = () => camStar(i);
    wrap.append(img, del, star);
    return wrap;
  }));
  $('camCount').textContent = cam.shots.length;
  $('camDone').disabled = !cam.shots.length;
}

async function camSnap() {
  if (!cam.stream) return;
  const flash = $('camFlash');
  flash.classList.add('on');
  requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
  // takePhoto gives the sensor's full resolution; a video frame is the fallback when it is missing or busy.
  let blob = null;
  try { if (cam.capture) blob = await cam.capture.takePhoto(); } catch {}
  if (!blob) {
    const v = $('camVideo');
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  }
  if (!cam.stream) return;
  const file = new File([blob], `photo-${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
  cam.shots.push({ file, url: URL.createObjectURL(blob), primary: false });
  camRenderShots();
  $('camShots').scrollLeft = $('camShots').scrollWidth;
}

// At most one starred shot; tapping it again clears the star and leaves the item's main photo alone.
function camStar(i) {
  const on = !cam.shots[i].primary;
  cam.shots.forEach((s, n) => { s.primary = on && n === i; });
  camRenderShots();
  if (viewerIsOpen()) viewerPos();
}

const camStarAction = { icon: 'i-star', label: 'Make main photo', run: camStar, pressed: i => !!cam.shots[i]?.primary };
const camDeleteAction = {
  icon: 'i-trash', label: 'Delete photo',
  run(i) {
    URL.revokeObjectURL(cam.shots[i].url);
    cam.shots.splice(i, 1);
    camRenderShots();
    if (cam.shots.length) viewerRender(cam.shots.map(s => s.url), i);
    else history.back();
  },
};

$('hbCamBtn').onclick = camOpen;
$('camShutter').onclick = camSnap;
$('camClose').onclick = () => history.back();
$('camDone').onclick = () => {
  const files = cam.shots.map(s => s.file);
  const main = cam.shots.find(s => s.primary)?.file;
  camStop();
  history.back();
  hbUploadPhotos(files, main);
};
window.addEventListener('popstate', () => {
  if (viewerIsOpen()) { $('viewer').classList.add('hidden'); return; }
  if (!camIsOpen()) return;
  if (cam.shots.length && !confirm(`Discard ${cam.shots.length} photo${cam.shots.length > 1 ? 's' : ''}?`)) {
    history.pushState({ cam: true }, '');
    return;
  }
  camStop();
});

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

syncUI();
document.fonts?.ready.then(render);
render();
hbInit();
</script>
</body>
</html>
